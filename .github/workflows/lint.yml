name: Lint

on:
  pull_request:
    paths:
      - "src/**"
      - "components/**"
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Run ESLint
        run: pnpm exec eslint "src/**/*.{js,jsx,ts,tsx}" || echo "::warning file=src message=Lint issues detected"

      - name: Run Prettier check
        run: pnpm exec prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}" || true

      - name: Bundle size
        run: pnpm run check-size || echo "::warning file=dist message=Bundle size exceeded recommended threshold"
